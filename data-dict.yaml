$version: "0.1.0"
$learn_more: http://data-dict.tidyverse.org/
description: >
  Morphometric measurements and pregnancy/dependency status from sea otters
  captured or collected in Alaska, 1947-2019 by the U.S. Geological Survey
  (USGS) and the U.S. Fish and Wildlife Service (USFWS).
details: >
  Source: <https://doi.org/10.5066/P9Q5PD3Y>
tables:
  - name: otters
    source:
      parquet: otters.parquet
    description: >
      One row per individual otter. 4507 animals, of which 113 were measured
      more than once.
    columns:
      - name: otter_no
        type: string
        constraints: [required, unique]
        description: >
          Identifier of each individual otter. Assigned by researchers with a
          variety of naming conventions across locations and time. No
          identifier is ever reused for a different animal. Two pups were
          measured but never named, and carry ids invented during cleaning:
          synthetic-1 and synthetic-2.
        examples: ["67001", "70066", "90-044", "KOD-04-135", "SW-155"]

      - name: sex
        type: enum
        values: {M: Male, F: Female, U: Unknown}
        description: >
          Sex of otter.

      - name: recap
        type: enum
        values:
          '0': Captured only once
          '1': Recaptured at least one time
        description: >
          Whether the otter was captured only once or recaptured at least one
          time. Agrees with the number of rows in `measurements` for every
          otter but two. SW-155 is flagged as recaptured but has a single
          capture recorded here. SO-04-05a is flagged as captured once but has
          two, because the row dated 2008-05-18 looks mislabelled: its weight
          matches the pup SO-04-05 was carrying that day, which she recorded
          as SO-04-05b.

  - name: measurements
    source:
      parquet: measurements.parquet
    description: >
      One row per capture or collection event. An otter caught more than once
      contributes several rows. Includes 173 captures of dependent pups that
      the source recorded only as extra columns on the mother's row.
    columns:
      - name: measurement_id
        type: integer
        constraints: [required, unique]
        range: [1, 4643]
        description: >
          Identifier of each capture or collection event. Assigned when the
          data was cleaned; it has no meaning in the source files.

      - name: otter_no
        type: string
        constraints: [required]
        description: >
          The otter that was captured or collected.
        examples: ["67001", "70066", "90-044", "KOD-04-135", "SW-155"]

      - name: date
        type: date
        range: [1947-05-02, 2019-05-30]
        description: >
          Date of capture or collection. Together with otter_no this
          identifies a capture, except for KWK-59-162, whose post-captivity
          re-weighing on 1959-05-13 appears to have kept the original capture
          date rather than the date it was actually weighed.

      - name: location
        type: string
        constraints: [required]
        description: >
          Place of capture or collection. Derived from local geographic place
          names. See `locations` for the region and area it sits in.
        examples: [adak, chiniak bay, kiska, SE - whale bay, yukon island]

      - name: lat
        type: number(quantity)
        range: [51.37, 60.71]
        description: >
          Latitude of capture or collection location in decimal degrees
          (WGS84).

      - name: long
        type: number(quantity)
        range: [-178.97, 179.40]
        description: >
          Longitude of capture or collection location in decimal degrees
          (WGS84).

      - name: weight
        type: number(quantity)
        range: [0.8, 45.4]
        description: >
          Weight of otter in kilograms.

      - name: tail_lgth_1
        type: number(quantity)
        range: [15.5, 37.2]
        description: >
          Length of tail in centimeters; first replicate measurement.

      - name: tail_lgth_2
        type: number(quantity)
        range: [21.5, 37.0]
        description: >
          Length of tail in centimeters; second replicate measurement.

      - name: tail_lgth_3
        type: number(quantity)
        range: [22.0, 37.0]
        description: >
          Length of tail in centimeters; third replicate measurement.

      - name: mean_tail_lgth
        type: number(quantity)
        range: [15.5, 37.0]
        description: >
          Mean of replicate tail length measurements in centimeters.

      - name: lgth1
        type: number(quantity)
        range: [40.2, 148.2]
        description: >
          Length of otter including tail in centimeters; first replicate
          measurement.

      - name: lgth2
        type: number(quantity)
        range: [90.0, 146.5]
        description: >
          Length of otter including tail in centimeters; second replicate
          measurement.

      - name: lgth3
        type: number(quantity)
        range: [102.2, 143.7]
        description: >
          Length of otter including tail in centimeters; third replicate
          measurement.

      - name: curvilinear_correction
        type: enum
        values:
          '1': No correction (standard length)
          '0.974': Correction for curvilinear length
        description: >
          Correction factor for lengths measured as curvilinear instead of
          standard length.

      - name: mean_lgth
        type: number(quantity)
        range: [40.2, 148.2]
        description: >
          Mean of replicate otter length measurements in centimeters.

      - name: true_standard_lgth
        type: number(quantity)
        range: [40.2, 155.9]
        description: >
          Mean length multiplied by curvilinear correction factor, in
          centimeters.

      - name: body_lgth
        type: number(quantity)
        range: [56.5, 115.2]
        description: >
          Body length not including tail (true_standard_lgth -
          mean_tail_lgth) in centimeters.

      - name: curve_lgth1
        type: number(quantity)
        range: [47.0, 160.0]
        description: >
          Curvilinear length of otter including tail in centimeters; first
          replicate measurement.

      - name: curve_lgth2
        type: number(quantity)
        range: [111.5, 166.0]
        description: >
          Curvilinear length of otter including tail in centimeters; second
          replicate measurement.

      - name: girth1
        type: number(quantity)
        range: [29.5, 96.5]
        description: >
          Circumference of chest at xiphoid in centimeters; first replicate
          measurement.

      - name: girth2
        type: number(quantity)
        range: [74.5, 78.0]
        description: >
          Circumference of chest at xiphoid in centimeters; second replicate
          measurement.

      - name: mean_girth
        type: number(quantity)
        range: [29.5, 96.5]
        description: >
          Mean of replicate girth measurements in centimeters.

      - name: paw
        type: number(quantity)
        range: [34.0, 63.0]
        description: >
          Width of front paw at widest point in millimeters.

      - name: w_pup
        type: enum
        values:
          'N': Not with dependent pup
          'U': Unknown
          'D': The individual is the dependent pup
          'Y': With dependent pup
        description: >
          Whether an adult female was with a dependent pup at capture or
          collection. Y without a pup_number means a pup was seen but not
          identified; 251 captures are recorded that way and the pup has no
          row of its own.

      - name: pup_number
        type: string
        description: >
          The dependent pup accompanying the otter at this capture. The pup's
          own weight and length, which the source recorded on the mother's
          row, are now a capture of the pup in its own right; see the
          `measurements` to `otters` relationship below.
        examples: ["67002", "92-198", "KOD_04_121", "SO-08-20", "SO-98-50a"]

      - name: fetus_pres
        type: enum
        values:
          'N': No fetus present
          'Y': Fetus present
          'M': Multiple fetuses present
        description: >
          Whether fetus was present at time of collection. Agrees exactly with
          the number of matching rows in `fetuses`: none for N, one for Y, and
          two or three for M.

      - name: fe_rep_con
        type: enum
        values:
          IMP: Implanted pregnant
          UNI: Unimplanted pregnant
          ANE: Anestrous
          EST: In estrous
          POS: Undocumented
          PRO: Undocumented
          FAI: Undocumented
        description: >
          Female reproductive condition.

      - name: fe_rep_sta
        type: enum
        values: {'N': Nulliparous, 'M': Multiparous, 'P': Primiparous}
        description: >
          Female reproductive state (collections only).

      - name: pregnancy_status
        type: enum
        values:
          NP: Not pregnant at collection or capture
          U: Unknown
          NPP: Not palpably pregnant at capture
          P: Fetus present at collection or palpably pregnant at capture
          PP: Undocumented
        description: >
          Pregnancy status.

      - name: can_dia
        type: number(quantity)
        range: [2.9, 11.1]
        description: >
          Diameter of canine tooth at gum line (widest dimension) in
          millimeters.

      - name: final_age
        type: number(ordinal)
        range: [0, 23]
        description: >
          Age of otter at time of capture or collection in years, based on
          known age, tooth cementum age, or field age estimate.

      - name: age_category
        type: enum
        values:
          '0': Less than 1 year
          '1.5': 1-2 years
          '7': 3-10 years
          '13': Greater than 10 years
        description: >
          Age category of otter.

      - name: bacula_lgth
        type: number(quantity)
        range: [2.2, 21.6]
        description: >
          Baculum length in centimeters (males only).

      - name: comments
        type: string
        description: >
          Notes about the capture or collection event.
        examples: ["given 92-114", "died summer 1997", "originally 84-001", "pup < 8 wks later but preg missed at capture"]

      - name: cause_of_death_capture_method
        type: enum
        values:
          '0': Typical live capture
          '1': Collected via harvest
          '4': Measured after some time in captivity
          '5': Captured off a beach
        description: >
          Cause of death or capture method.

  - name: locations
    source:
      parquet: locations.parquet
    description: >
      One row per named place of capture or collection, giving the region and
      area it belongs to.
    columns:
      - name: location
        type: string
        constraints: [required, unique]
        description: >
          Place name, as recorded in the capture records.
        examples: [adak, chiniak bay, kiska, SE - whale bay, yukon island]

      - name: region
        type: enum
        values:
          west aleutians: Western Aleutian Islands
          east aleutians: Eastern Aleutian Islands
          AK peninsula: Alaska Peninsula
          kodiak: Kodiak Island
          lower cook inlet: Lower Cook Inlet
          PWS: Prince William Sound
          SE: Southeast Alaska
        description: >
          Region within the state (may encompass multiple areas).

      - name: area
        type: enum
        values:
          near islands: Near Island group
          rats: Rat Island group
          delarofs: Delarof Island group
          andreanofs: Andreanof Island group
          fox islands: Fox Island group
          WAP: Western Alaska Peninsula
          EAP: Eastern Alaska Peninsula
          shuyak: Shuyak Island
          afognak: Afognak Island
          kodiak: Kodiak Island
          kachemak: Kachemak Bay
          WPWS: Western Prince William Sound
          EPWS: Eastern Prince William Sound
          NSE: Northern Southeast Alaska
          CSE: Central Southeast Alaska
          SSE: Southern Southeast Alaska
        description: >
          Area within the state.

  - name: fetuses
    source:
      parquet: fetuses.parquet
    description: >
      One row per fetus found in a collected female, so a female carrying
      more than one contributes several rows.
    columns:
      - name: measurement_id
        type: integer
        constraints: [required]
        description: >
          The capture or collection event at which the fetus was found.

      - name: fetus_num
        type: number(ordinal)
        constraints: [required]
        range: [1, 3]
        description: >
          Index distinguishing the fetuses found at one collection, not a
          count. Numbered from 1 in no meaningful order.

      - name: fetus_sex
        type: enum
        values: {M: Male, F: Female, U: Unknown}
        description: >
          Sex of fetus.

      - name: fetus_wt
        type: number(quantity)
        range: [0.1, 2112.0]
        description: >
          Weight of fetus in grams.

      - name: fetus_lth
        type: number(quantity)
        range: [0.3, 65.0]
        description: >
          Length of fetus in centimeters.

relationships:
  - description: >
      Links an otter to each time it was captured or collected.
    cardinality: one-to-many
    join: otters.otter_no = measurements.otter_no

  - description: >
      Links a collection event to the fetuses found in the collected female.
    cardinality: one-to-many
    join: measurements.measurement_id = fetuses.measurement_id

  - description: >
      Links a capture to the region and area of the place it happened.
    cardinality: many-to-one
    join: measurements.location = locations.location

  - description: >
      Links a capture of a female accompanied by a dependent pup to the pup
      itself. Every one of the 388 named pups now has a row in `otters`, and
      the capture that measured it is the pup's own row in `measurements` with
      the same date.
    cardinality: many-to-one
    join: measurements.pup_number = otters.otter_no

glossary:
  curvilinear length: >
    Length measured along the curve of the back as the otter lay on its
    stomach, used primarily during experimental harvests (1967-1971).
  standard length: >
    Straight-line length measured as the otter lay on its back, used during
    early studies (1947-1963) and more recent live captures (1986-2019).
  true standard length: >
    Curvilinear length corrected by a factor of 0.974 to make it comparable
    to standard length measurements.
  experimental harvest: >
    Controlled collection of sea otters primarily conducted in the 1960s and
    1970s for research purposes.
  nulliparous: >
    A female that has never given birth.
  primiparous: >
    A female that has given birth once.
  multiparous: >
    A female that has given birth multiple times.
  baculum: >
    A bone found in the penis of male otters, measured as a way to estimate
    age class.
  xiphoid: >
    The lower portion of the sternum (breastbone), used as a landmark for
    girth measurements.
